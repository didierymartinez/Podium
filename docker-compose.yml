# Entorno local: PostgreSQL 16 (y MinIO con `docker compose --profile s3 up`). La app corre con `pnpm dev` (o descomenta el servicio app).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: podium
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Archivos con API S3 (como R2). Opcional: sin esto la app guarda en disco (STORAGE_DRIVER=local).
  # Para usarlo: STORAGE_DRIVER=s3, S3_ENDPOINT=http://localhost:9000, S3_BUCKET=podium,
  # S3_ACCESS_KEY_ID=podium, S3_SECRET_ACCESS_KEY=podium-dev-secret y crear el bucket en http://localhost:9001.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: podium
      MINIO_ROOT_PASSWORD: podium-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    profiles: ["s3"]

  # app:
  #   build:
  #     context: .
  #     args:
  #       NEXT_PUBLIC_AUTH_PROVIDER: dev
  #   env_file: .env
  #   environment:
  #     DATABASE_URL: postgres://podium_app:podium_app_dev@db:5432/podium
  #     ALLOW_DEV_AUTH: "true"
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - db

volumes:
  pgdata:
  miniodata:
